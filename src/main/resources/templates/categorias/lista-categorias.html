<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Categorías - ERP Fontanería</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Barra de navegación compartida -->
<div th:replace="~{fragments/navbar :: menu-superior}"></div>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Categorías de Avería</h2>

        <div>
            <a th:href="@{/}" class="btn btn-outline-dark me-2">Inicio</a>
            <a th:href="@{/categorias/nueva}" class="btn btn-success">+ Nueva Categoría</a>
        </div>
    </div>

    <!-- Alerta de Error (si intenta borrar una categoría en uso) -->
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${mensajeError}">
        <span th:text="${mensajeError}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Alerta de Éxito (si se borra o guarda correctamente) -->
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${mensajeExito}">
        <span th:text="${mensajeExito}">Éxito</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Fin del bloque de alertas -->

    <!-- Tabla de Categorías -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(categorias)}">
                    <td colspan="4" class="text-center text-muted py-4">No hay categorías registradas actualmente.</td>
                </tr>
                <tr th:each="cat : ${categorias}">
                    <td th:text="${cat.id}">1</td>
                    <td class="fw-bold" th:text="${cat.nombre}">Fugas de agua</td>
                    <td th:text="${cat.descripcion}">Problemas en tuberías y grifería general</td>
                    <td class="text-center">
                        <a th:href="@{/categorias/editar/{id}(id=${cat.id})}" class="btn btn-warning btn-sm me-1">Editar</a>
                        <a th:href="@{/categorias/eliminar/{id}(id=${cat.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Estás seguro de eliminar esta categoría?');">Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
