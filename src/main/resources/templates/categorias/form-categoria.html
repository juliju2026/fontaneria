<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${categoriaAveria.id == null} ? 'Nueva Categoría' : 'Editar Categoría'">Formulario Categoría</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Barra de navegación compartida -->
<div th:replace="~{fragments/navbar :: menu-superior}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h2 class="mb-4 text-center" th:text="${categoriaAveria.id == null} ? 'Registrar Categoría' : 'Editar Categoría'">Registro</h2>

                    <form th:action="@{/categorias/guardar}" th:object="${categoriaAveria}" method="post">

                        <!-- Campo oculto imprescindible para la edición -->
                        <input type="hidden" th:field="*{id}" />

                        <!-- Nombre de la categoría -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre de la Categoría</label>
                            <input type="text" id="nombre" th:field="*{nombre}" class="form-control" placeholder="Ej: Fugas, Atascos, Calderas...">
                            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <!-- Descripción -->
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea id="descripcion" th:field="*{descripcion}" class="form-control" rows="3" placeholder="Breve descripción opcional..."></textarea>
                        </div>

                        <!-- Botones de acción -->
                        <div class="d-flex justify-content-between mt-4">
                            <div>
                                <a th:href="@{/}" class="btn btn-outline-dark me-2">Inicio</a>
                                <a th:href="@{/categorias}" class="btn btn-secondary">Cancelar</a>
                            </div>
                            <button type="submit" class="btn btn-primary">Guardar Categoría</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
