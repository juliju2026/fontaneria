<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${servicioAveria.id == null} ? 'Nueva Avería' : 'Editar Avería'">Formulario Avería</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Barra de navegación compartida -->
<div th:replace="~{fragments/navbar :: menu-superior}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="mb-4 text-center" th:text="${servicioAveria.id == null} ? 'Registrar Nueva Avería' : 'Editar Avería'">Registro</h2>

                    <form th:action="@{/averias/guardar}" th:object="${servicioAveria}" method="post"
                          onsubmit="document.getElementById('btnGuardar').disabled = true; document.getElementById('btnGuardar').innerText = 'Guardando...';">

                        <!-- Campo oculto para el ID -->
                        <input type="hidden" th:field="*{id}" />

                        <!-- Cliente asociado -->
                        <div class="mb-3">
                            <label for="clienteSelect" class="form-label">Cliente Asociado</label>
                            <select id="clienteSelect" th:field="*{cliente}" class="form-select" required>
                                <option value="">-- Seleccione un cliente --</option>
                                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombreCompleto}">Cliente</option>
                            </select>
                        </div>

                        <!-- Checkbox para autocompletar dirección teléfono y nombre con datos del cliente -->
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="usarDatosCliente" checked>
                            <label class="form-check-label" for="usarDatosCliente">
                                Cargar los datos de direccion, nombre y telefono registrados del cliente
                            </label>
                        </div>

                        <!-- Descripción del problema -->
                        <div class="mb-3">
                            <label for="descripcionProblema" class="form-label">Descripción del Problema</label>
                            <textarea id="descripcionProblema" th:field="*{descripcionProblema}" class="form-control" required rows="3" placeholder="Detalle de la avería..."></textarea>
                            <div class="text-danger small" th:if="${#fields.hasErrors('descripcionProblema')}" th:errors="*{descripcionProblema}"></div>
                        </div>

                        <!-- Dirección del servicio -->
                        <div class="mb-3">
                            <label for="direccionServicio" class="form-label">Dirección del Servicio</label>
                            <input type="text" id="direccionServicio" th:field="*{direccionServicio}" class="form-control fw-bold" placeholder="Dirección exacta de la avería." oninput="this.classList.toggle('fw-bold',this.value==='')" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('direccionServicio')}" th:errors="*{direccionServicio}"></div>
                        </div>


                        <!-- Datos de contacto en sitio -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombreContacto" class="form-label">Persona de Contacto</label>
                                <input type="text" id="nombreContacto" th:field="*{nombreContacto}" class="form-control fw-bold" placeholder="Nombre de persona de contacto en el lugar." oninput="this.classList.toggle('fw-bold',this.value==='')" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('nombreContacto')}" th:errors="*{nombreContacto}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="telefonoContacto" class="form-label">Teléfono de Contacto</label>
                                <input type="text" id="telefonoContacto" th:field="*{telefonoContacto}" class="form-control fw-bold" placeholder="Teléfono de contacto de la persona en el lugar." oninput="this.classList.toggle('fw-bold',this.value==='')" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('telefonoContacto')}" th:errors="*{telefonoContacto}"></div>
                            </div>
                        </div>

                        <!-- Categorías de Avería (Relación ManyToMany obligatoria) -->
                        <div class="mb-3">
                            <label for="categorias" class="form-label">Categorías de la Avería (Seleccione una o varias)</label>

                            <!-- Si hay categorías, muestra el select normal -->
                            <select id="categorias" th:field="*{categorias}" class="form-select" multiple size="4"
                                    th:if="${not #lists.isEmpty(categorias)}" required>
                                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}">Categoría</option>
                            </select>

                            <!-- Si NO hay categorías, muestra un mensaje de alerta con enlace directo -->
                            <div class="alert alert-warning py-2" th:if="${#lists.isEmpty(categorias)}">
                                ⚠️ No hay categorías registradas aún. Debes crear al menos una antes de registrar una avería.
                                <a th:href="@{/categorias/nueva}" class="alert-link fw-bold">Crear categoría ahora</a>
                            </div>
                            <!-- Mensaje de error si no se selecciona ninguna -->
                            <div class="text-danger small" th:if="${#fields.hasErrors('categorias')}" th:errors="*{categorias}"></div>
                            <div class="form-text" th:if="${not #lists.isEmpty(categorias)}">Mantén presionada la tecla Ctrl (o Cmd en Mac) para seleccionar varias categorías.</div>
                        </div>

                        <!-- Botones de acción -->
                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/averias}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" id="btnGuardar" class="btn btn-primary">Guardar Avería</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script para autocompletar campos con informacion del cliente -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const clienteSelect = document.getElementById('clienteSelect');
        const checkboxDatosCliente = document.getElementById('usarDatosCliente');
        const inputNombreContacto = document.getElementById('nombreContacto');
        const inputTelefonoContacto = document.getElementById('telefonoContacto');
        const inputDireccionServicio = document.getElementById('direccionServicio');

        function cargarDatosCliente() {
            if (!clienteSelect || !checkboxDatosCliente) return;

            const clienteId = clienteSelect.value;

            // Si no hay cliente seleccionado o el checkbox no está marcado, no hacemos nada
            if (!clienteId || !checkboxDatosCliente.checked) {
                return;
            }

            // Realizamos la petición al endpoint JSON del cliente
            fetch(`/clientes/api/${clienteId}`)
                .then(response => {
                    if (!response.ok) throw new Error('No se pudo obtener el cliente');
                    return response.json();
                })
                .then(data => {
                    // Rellenamos los campos si tienen valor y existen en el DOM
                    if (data.nombreCompleto && inputNombreContacto) {
                        inputNombreContacto.value = data.nombreCompleto;
                    }
                    if (data.telefono && inputTelefonoContacto) {
                        inputTelefonoContacto.value = data.telefono;
                    }
                    if (data.direccion && inputDireccionServicio) {
                        inputDireccionServicio.value = data.direccion;
                    }
                })
                .catch(error => console.error('Error al cargar los datos del cliente:', error));
        }

        // 1. COMPROBACIÓN INICIAL: Si entramos con un cliente ya preseleccionado (ej. desde el histórico)
        // y el checkbox está marcado por defecto, cargamos los datos automáticamente al abrir la página.
        if (clienteSelect && clienteSelect.value) {
            cargarDatosCliente();
        }

        // 2. EVENTO: Cuando cambia la selección del cliente en el desplegable
        if (clienteSelect) {
            clienteSelect.addEventListener('change', cargarDatosCliente);
        }

        // 3. EVENTO: Cuando el usuario marca o desmarca el checkbox
        if (checkboxDatosCliente) {
            checkboxDatosCliente.addEventListener('change', function() {
                if (this.checked) {
                    cargarDatosCliente();
                } else {
                    // Si desmarca la casilla, limpiamos los campos
                    if (inputNombreContacto) inputNombreContacto.value = '';
                    if (inputTelefonoContacto) inputTelefonoContacto.value = '';
                    if (inputDireccionServicio) inputDireccionServicio.value = '';
                }
            });
        }
    });
</script>
</body>
</html>
