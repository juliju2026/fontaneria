<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Averías - ERP Fontanería</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Barra de navegación compartida -->
<div th:replace="~{fragments/navbar :: menu-superior}"></div>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Servicios y Averías</h2>
        <div>
            <a th:href="@{/}" class="btn btn-outline-dark me-2">Inicio</a>
            <a th:href="@{/averias/nueva}" class="btn btn-success">+ Nueva Avería</a>
        </div>
    </div>

    <!-- Tabla de Averías -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Descripción</th>
                    <th>Dirección</th>
                    <th>Cliente</th>
                    <th>Estado Operativo</th>
                    <th>Pago</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(averias)}">
                    <td colspan="7" class="text-center text-muted py-4">No hay averías registradas actualmente.</td>
                </tr>
                <tr th:each="averia : ${averias}">
                    <td th:text="${averia.id}">1</td>
                    <td class="fw-bold" th:text="${averia.descripcionProblema}">Fuga en tubería principal</td>
                    <td th:text="${averia.direccionServicio}">Calle Mayor 12</td>
                    <td th:text="${averia.cliente != null ? averia.cliente.nombreCompleto : 'Sin cliente'}">Juan Pérez</td>
                    <td>
                        <span class="badge bg-secondary" th:text="${averia.estado}">PENDIENTE</span>
                    </td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${averia.estadoPago}">PENDIENTE</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/averias/editar/{id}(id=${averia.id})}" class="btn btn-warning btn-sm me-1">Editar</a>
                        <a th:href="@{/averias/eliminar/{id}(id=${averia.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Estás seguro de eliminar esta avería?');">Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
