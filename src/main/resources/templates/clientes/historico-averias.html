<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Averías - Fontanería ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: menu-superior}"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">Histórico de Averías</h2>
            <p class="text-muted mb-0">
                Cliente: <strong th:text="${cliente.nombreCompleto}">Juan Pérez</strong>
                (<span th:text="${cliente.telefono}">600123456</span>)
            </p>
        </div>
        <div>
            <a th:href="@{/averias/nueva(clienteId=${cliente.id})}" class="btn btn-primary me-2">+ Nueva Avería</a>
            <a th:href="@{/clientes}" class="btn btn-secondary">Volver a Clientes</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Descripción del Problema</th>
                    <th>Dirección del Servicio</th>
                    <th>Categorías</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="averia : ${averias}">
                    <td th:text="${averia.id}">1</td>
                    <td th:text="${#temporals.format(averia.fechaCreacion, 'dd/MM/yyyy HH:mm')}">16/11/2026</td>
                    <td th:text="${averia.descripcionProblema}">Fuga en tubería</td>
                    <td th:text="${averia.direccionServicio}">Calle Falsa 123</td>
                    <td>
                        <span th:each="cat : ${averia.categorias}"
                              th:text="${cat.nombre}"
                              class="badge bg-secondary me-1">Fontanería</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/averias/editar/{id}(id=${averia.id})}"
                           class="btn btn-warning btn-sm">Editar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(averias)}">
                    <td colspan="6" class="text-center text-muted py-4">Este cliente no tiene averías registradas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
