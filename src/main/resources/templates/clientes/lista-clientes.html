<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes - Fontanería ERP</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<!-- Barra de navegación compartida -->
<div th:replace="~{fragments/navbar :: menu-superior}"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Clientes (CRM)</h2>
        <a th:href="@{/clientes/nuevo}" class="btn btn-primary">+ Nuevo Cliente</a>
    </div>

    <!-- Formulario de Búsqueda -->
    <form th:action="@{/clientes}" method="get" class="input-group mb-3">
        <input type="text" name="filtro" class="form-control" placeholder="Buscar por nombre completo..." th:value="${filtro}"
        aria-label="Buscar clientes por nombre completo">
        <button class="btn btn-outline-secondary" type="submit">Buscar</button>
        <a th:href="@{/clientes}" class="btn btn-outline-danger">Limpiar</a>
    </form>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>NIF/DNI</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Dirección</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.id}">1</td>

                    <!-- Aquí es donde se muestra el campo en la tabla -->
                    <td th:text="${cliente.nombreCompleto}">Juan Pérez</td>
                    <td th:text="${cliente.nif}">12345678A</td>
                    <td th:text="${cliente.telefono}">600123456</td>
                    <td th:text="${cliente.correo}">juan@mail.com</td>
                    <td th:text="${cliente.direccion}">Calle Falsa 123</td>

                    <!-- Botones de acciones... -->
                    <td class="text-center" style="width: 140px;">
                        <div class="d-flex flex-column gap-1">
                            <!-- Botón Editar -->
                            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}"
                               class="btn btn-warning btn-sm w-100">Editar</a>

                            <!-- Botón Eliminar (si no tiene histórico) -->
                            <a th:if="${#lists.isEmpty(cliente.averias)}"
                               th:href="@{/clientes/eliminar/{id}(id=${cliente.id})}"
                               class="btn btn-danger btn-sm w-100"
                               onclick="return confirm('¿Estás seguro de eliminar este cliente?');">Eliminar</a>

                            <!-- Botón Ver Histórico (si tiene averías registradas) -->
                            <a th:if="${not #lists.isEmpty(cliente.averias)}"
                               th:href="@{/clientes/{id}/averias(id=${cliente.id})}"
                               class="btn btn-info btn-sm w-100 text-white">Ver histórico</a>
                        </div>
                    </td>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="7" class="text-center text-muted py-4">No hay clientes registrados todavía.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
