<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Cliente - Fontanería ERP</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="mb-4 text-center" th:text="${cliente.id == null} ? 'Nuevo Cliente' : 'Editar Cliente'">Nuevo Cliente</h2>

            <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">

                <!-- Campo oculto vital para diferenciar si estamos creando o editando -->
                <input type="hidden" th:field="*{id}" />

                <!-- Nombre Completo -->
                <div class="mb-3">
                    <label for="nombreCompleto" class="form-label">Nombre Completo</label>
                    <input type="text" id="nombreCompleto" th:field="*{nombreCompleto}" class="form-control"
                           th:classappend="${#fields.hasErrors('nombreCompleto')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></div>
                </div>

                <!-- NIF / DNI -->
                <div class="mb-3">
                    <label for="nif" class="form-label">NIF / DNI</label>
                    <input type="text" id="nif" th:field="*{nif}" class="form-control"
                           th:classappend="${#fields.hasErrors('nif')} ? 'is-invalid' : ''" placeholder="12345678A o X1234567Z">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nif')}" th:errors="*{nif}"></div>
                </div>

                <!-- Teléfono -->
                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono (WhatsApp)</label>
                    <input type="text" id="telefono" th:field="*{telefono}" class="form-control"
                           th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''" placeholder="+34600123456">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                </div>

                <!-- Correo -->
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo Electrónico</label>
                    <input type="email" id="correo" th:field="*{correo}" class="form-control"
                           th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                </div>

                <!-- Dirección -->
                <div class="mb-3">
                    <label for="direccion" class="form-label">Dirección</label>
                    <textarea id="direccion" th:field="*{direccion}" class="form-control" rows="2"
                              th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid' : ''"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
                </div>

                <!-- Botones de acción -->
                <div class="d-flex justify-content-between">
                    <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar Cliente</button>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
