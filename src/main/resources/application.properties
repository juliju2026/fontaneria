spring.application.name=fontaneria


spring.datasource.url=jdbc:mysql://localhost:3306/fontaneria
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.admin.username=${APPP_ADMIN_USERNAME:admin}
app.admin.password=${APPP_ADMIN_PASSWORD:admin1234}
server.port=8080

logging.level.org.thymeleaf=TRACE